apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: audit-zone
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
        - name: host-volume
          mountPath: /data-host
  volumes:
    - name: host-volume
      hostPath:
        path: /   # путь на узле, который будет смонтирован
        type: DirectoryOrCreate
